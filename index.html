<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>文献タグ検索 | IL-31 / AD / PN / 乾癬</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      line-height: 1.5;
      color: #111827;
      background: #f3f4f6;
    }

    body {
      margin: 0;
      padding: 24px;
      background: radial-gradient(circle at top left, #dbeafe, #f9fafb);
    }

    .root-container {
      min-height: 100vh;
    }

    .page-container {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.6rem;
      margin: 0 0 4px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #6b7280;
      margin: 0 0 20px;
    }

    .filter-panel {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 16px 18px 12px;
      box-shadow: 0 18px 35px rgba(15, 23, 42, 0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.3);
      margin-bottom: 18px;
    }

    .filter-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-header-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .filter-title {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .filter-summary {
      font-size: 0.8rem;
      color: #6b7280;
    }

    .clear-button {
      border: none;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.75rem;
      cursor: pointer;
      background: #eff6ff;
      color: #1d4ed8;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .clear-button:hover {
      background: #dbeafe;
      transform: translateY(-1px);
    }

    .filters-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px 14px;
      margin-bottom: 8px;
    }

    @media (max-width: 800px) {
      .filters-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      body {
        padding: 16px;
      }
      .filters-grid {
        grid-template-columns: 1fr;
      }
    }

    .filter-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.8rem;
    }

    .filter-label {
      color: #4b5563;
      font-weight: 500;
    }

    .filter-select {
      border-radius: 999px;
      border: 1px solid #e5e7eb;
      padding: 6px 10px;
      font-size: 0.8rem;
      background: #f9fafb;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }

    .filter-select:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.4);
      background: #ffffff;
    }

    .active-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.75rem;
      margin-top: 4px;
    }

    .filter-chip {
      border-radius: 999px;
      background: #e5e7eb;
      padding: 2px 10px;
      color: #374151;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 8px 2px 10px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .results-count {
      font-size: 0.9rem;
      color: #374151;
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    @media (max-width: 900px) {
      .results-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .results-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.12);
      border: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      transition: transform 0.12s ease, box-shadow 0.12s ease,
        border-color 0.12s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.18);
      border-color: #bfdbfe;
    }

    .card-image-wrap {
      width: 100%;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      background: linear-gradient(135deg, #e5e7eb, #f9fafb);
    }

    .card-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-body {
      padding: 10px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-meta-top {
      font-size: 0.7rem;
      color: #6b7280;
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin: 0;
      white-space: pre-wrap;
    }

    .card-desc {
      font-size: 0.8rem;
      color: #4b5563;
      margin: 2px 0 4px;
    }

    .card-footer {
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .tag-pill {
      font-size: 0.7rem;
      border-radius: 999px;
      padding: 2px 8px;
      background: #eff6ff;
      color: #1d4ed8;
      white-space: nowrap;
    }

    .tag-pill.secondary {
      background: #f3f4ff;
      color: #4f46e5;
    }

    .tag-pill.neck {
      background: #fef3c7;
      color: #92400e;
    }

    .card-link {
      font-size: 0.8rem;
    }

    .card-link a {
      color: #2563eb;
      text-decoration: none;
    }

    .card-link a:hover {
      text-decoration: underline;
    }

    .empty-state {
      margin-top: 20px;
      padding: 16px;
      border-radius: 16px;
      border: 1px dashed #d1d5db;
      background: rgba(249, 250, 251, 0.9);
      font-size: 0.85rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="root-container">
    <div class="page-container">
      <header>
        <h1>文献タグ検索</h1>
        <p class="subtitle">
          ※文献提供はリアクティブ対応です
        </p>
      </header>

      <!-- フィルタパネルここから -->
      <section class="filter-panel">
        <div class="filter-header">
          <div class="filter-header-left">
            <div class="filter-title">タグで絞り込み</div>
            <div class="filter-summary" id="filter-summary">
              まず疾患を選択してください（未選択の場合は全件表示）
            </div>
          </div>
          <button class="clear-button" id="clear-filters">
            条件をクリア
          </button>
        </div>

        <div class="filters-grid">
          <!-- 疾患：常に表示 -->
          <div class="filter-field" id="field-disease">
            <label class="filter-label" for="filter-disease">疾患</label>
            <select id="filter-disease" class="filter-select">
              <option value="">すべて</option>
              <option value="AD">AD</option>
              <option value="PN">PN</option>
              <option value="乾癬">乾癬</option>
            </select>
          </div>

          <!-- 文献：常に表示 -->
          <div class="filter-field" id="field-docType">
            <label class="filter-label" for="filter-docType">文献</label>
            <select id="filter-docType" class="filter-select">
              <option value="">すべて</option>
              <option value="臨床">臨床</option>
              <option value="基礎">基礎</option>
              <option value="レビュー・メタアナ等">レビュー・メタアナ等</option>
            </select>
          </div>

          <!-- 内容(AD・PN) / 内容(乾癬) 共通 -->
          <div class="filter-field" id="field-content">
            <label class="filter-label" for="filter-content" id="label-content">
              内容
            </label>
            <select id="filter-content" class="filter-select">
              <option value="">すべて</option>
              <!-- AD・PN用 -->
              <option value="有効性" data-disease="AD,PN">有効性</option>
              <option value="安全性" data-disease="AD,PN,乾癬">安全性</option>
              <!-- 乾癬用 -->
              <option value="使い分け" data-disease="乾癬">使い分け</option>
              <option value="早期介入" data-disease="乾癬">早期介入</option>
              <option value="CTX1st訴求" data-disease="乾癬">CTX1st訴求</option>
            </select>
          </div>

          <!-- 有効性詳細 / 病態 共通 -->
          <div class="filter-field" id="field-content2">
            <label class="filter-label" for="filter-content2" id="label-content2">
              内容2
            </label>
            <select id="filter-content2" class="filter-select">
              <option value="">すべて</option>
              <!-- AD・PN用: 有効性詳細 -->
              <option value="繊維化関連" data-disease="AD,PN">繊維化関連</option>
              <option value="睡眠障害関連" data-disease="AD,PN">睡眠障害関連</option>
              <!-- 乾癬用: 病態 -->
              <option value="頭部乾癬" data-disease="乾癬">頭部乾癬</option>
              <option value="爪乾癬" data-disease="乾癬">爪乾癬</option>
              <option value="体軸病変" data-disease="乾癬">体軸病変</option>
              <option value="PsV" data-disease="乾癬">PsV</option>
              <option value="PsA" data-disease="乾癬">PsA</option>
            </select>
          </div>

          <!-- 被験者：AD/PNのみ使う -->
          <div class="filter-field" id="field-subject">
            <label class="filter-label" for="filter-subject">被験者</label>
            <select id="filter-subject" class="filter-select">
              <option value="">すべて</option>
              <option value="成人">成人</option>
              <option value="小児">小児</option>
            </select>
          </div>

          <!-- ネック：AD/PNのみ使う -->
          <div class="filter-field" id="field-neck">
            <label class="filter-label" for="filter-neck">ネック</label>
            <select id="filter-neck" class="filter-select">
              <option value="">すべて</option>
              <option value="副作用懸念">副作用懸念</option>
              <option value="IC課題">IC課題</option>
              <option value="症例像不明確">症例像不明確</option>
            </select>
          </div>
        </div>

        <div class="active-filters" id="active-filters"></div>
      </section>
      <!-- フィルタパネルここまで -->

      <div class="results-header">
        <div class="results-count" id="results-count">読み込み中...</div>
      </div>

      <section class="results-grid" id="results"></section>
      <div class="empty-state" id="empty-state" style="display:none;">
        該当する文献がありません。タグ条件を少し緩めてみてください。
      </div>
    </div>
  </div>

  <script>
    const DATA_URL =
      "https://raw.githubusercontent.com/basdrm39-netizen/paper-research-system/main/papers.json";

    const state = {
      disease: "",
      docType: "",
      content: "",
      content2: "",
      subject: "",
      neck: ""
    };

    const filterLabels = {
      disease: "疾患",
      docType: "文献",
      content: "内容",
      content2: "内容2",
      subject: "被験者",
      neck: "ネック"
    };

    let papers = [];

    const resultsEl = document.getElementById("results");
    const countEl = document.getElementById("results-count");
    const emptyEl = document.getElementById("empty-state");
    const activeFiltersEl = document.getElementById("active-filters");
    const summaryEl = document.getElementById("filter-summary");

    // 「AD、PN」「症例像不明確、IC課題」みたいな複数タグを配列に分割
    function splitMulti(value) {
      if (!value) return [];
      return value
        .toString()
        .split(/[、,]/)
        .map((v) => v.trim())
        .filter(Boolean);
    }

    // JSON側のフィルタ本体
    function applyFilters() {
      return papers.filter((p) => {
        if (state.disease) {
          if (!splitMulti(p.disease).includes(state.disease)) return false;
        }
        if (state.docType) {
          if (!splitMulti(p.docType).includes(state.docType)) return false;
        }
        if (state.content) {
          if (!splitMulti(p.content).includes(state.content)) return false;
        }
        if (state.content2) {
          if (!splitMulti(p.content2).includes(state.content2)) return false;
        }
        if (state.subject) {
          if (!splitMulti(p.subject).includes(state.subject)) return false;
        }
        if (state.neck) {
          if (!splitMulti(p.neck).includes(state.neck)) return false;
        }
        return true;
      });
    }

    // 疾患に応じて各セレクトの option を出し分け
    function updateFilterOptionVisibility() {
      const disease = state.disease;
      const selectIds = [
        "filter-docType",
        "filter-content",
        "filter-content2",
        "filter-subject",
        "filter-neck"
      ];

      selectIds.forEach((id) => {
        const sel = document.getElementById(id);
        if (!sel) return;

        Array.from(sel.options).forEach((opt) => {
          if (!opt.value) {
            opt.hidden = false;
            opt.disabled = false;
            return;
          }

          const allowed = opt.dataset.disease;

          if (!disease || !allowed) {
            opt.hidden = false;
            opt.disabled = false;
            return;
          }

          const list = allowed
            .split(",")
            .map((v) => v.trim())
            .filter(Boolean);
          const ok = list.includes(disease);

          opt.hidden = !ok;
          opt.disabled = !ok;

          if (!ok && opt.selected) {
            sel.value = "";
            const key = id.replace("filter-", "");
            if (key in state) {
              state[key] = "";
            }
          }
        });
      });
    }

    // 疾患・内容に応じて「どのフィールド自体を見せるか」
    function updateFieldVisibility() {
      const disease = state.disease;
      const content = state.content;

      const fieldContent = document.getElementById("field-content");
      const fieldContent2 = document.getElementById("field-content2");
      const fieldSubject = document.getElementById("field-subject");
      const fieldNeck = document.getElementById("field-neck");

      const labelContent = document.getElementById("label-content");
      const labelContent2 = document.getElementById("label-content2");

      const selContent2 = document.getElementById("filter-content2");
      const selSubject = document.getElementById("filter-subject");
      const selNeck = document.getElementById("filter-neck");

      if (!disease) {
        fieldContent.style.display = "none";
        fieldContent2.style.display = "none";
        fieldSubject.style.display = "none";
        fieldNeck.style.display = "none";

        labelContent.textContent = "内容";
        labelContent2.textContent = "内容2";
        return;
      }

      if (disease === "AD" || disease === "PN") {
        labelContent.textContent = "内容(AD・PN)";
        labelContent2.textContent = "有効性詳細";

        fieldContent.style.display = "";
        fieldSubject.style.display = "";
        fieldNeck.style.display = "";

        if (content === "有効性") {
          fieldContent2.style.display = "";
        } else {
          fieldContent2.style.display = "none";
          if (selContent2.value) {
            selContent2.value = "";
            state.content2 = "";
          }
        }
      } else if (disease === "乾癬") {
        labelContent.textContent = "内容(乾癬)";
        labelContent2.textContent = "病態";

        fieldContent.style.display = "";
        fieldContent2.style.display = "";

        fieldSubject.style.display = "none";
        fieldNeck.style.display = "none";

        if (selSubject.value) {
          selSubject.value = "";
          state.subject = "";
        }
        if (selNeck.value) {
          selNeck.value = "";
          state.neck = "";
        }
      } else {
        labelContent.textContent = "内容";
        labelContent2.textContent = "内容2";
        fieldContent.style.display = "";
        fieldContent2.style.display = "";
        fieldSubject.style.display = "";
        fieldNeck.style.display = "";
      }
    }

    function renderActiveFilters() {
      activeFiltersEl.innerHTML = "";
      const entries = Object.entries(state).filter(
        ([, value]) => value !== ""
      );

      if (entries.length === 0) {
        summaryEl.textContent =
          "まず疾患を選択してください（未選択の場合は全件表示）";
        return;
      }

      summaryEl.textContent = "現在の条件：";

      entries.forEach(([key, value]) => {
        const span = document.createElement("span");
        span.className = "filter-chip";
        span.textContent = filterLabels[key] + "：" + value;
        activeFiltersEl.appendChild(span);
      });
    }

    function renderResults(list) {
      resultsEl.innerHTML = "";
      if (!list.length) {
        emptyEl.style.display = "block";
        return;
      }
      emptyEl.style.display = "none";

      list.forEach((p) => {
        const card = document.createElement("article");
        card.className = "card";

        if (p.img) {
          const imgWrap = document.createElement("div");
          imgWrap.className = "card-image-wrap";

          const img = document.createElement("img");
          img.className = "card-image";
          img.src = p.img;
          img.alt = p.title;

          imgWrap.appendChild(img);
          card.appendChild(imgWrap);
        }

        const body = document.createElement("div");
        body.className = "card-body";

        const metaTop = document.createElement("div");
        metaTop.className = "card-meta-top";
        metaTop.textContent =
          (p.journal || "") + (p.year ? " / " + p.year : "");

        const title = document.createElement("h3");
        title.className = "card-title";
        title.textContent = p.title || "";

        body.appendChild(metaTop);
        body.appendChild(title);

        if (p.desc) {
          const desc = document.createElement("p");
          desc.className = "card-desc";
          desc.textContent = p.desc;
          body.appendChild(desc);
        }

        const footer = document.createElement("div");
        footer.className = "card-footer";

        const tags = document.createElement("div");
        tags.className = "card-tags";

        function addTag(text, extraClass) {
          if (!text) return;
          const span = document.createElement("span");
          span.className = "tag-pill" + (extraClass ? " " + extraClass : "");
          span.textContent = text;
          tags.appendChild(span);
        }

        addTag(p.disease);
        addTag(p.docType, "secondary");
        addTag(p.content, "secondary");
        addTag(p.content2, "secondary");
        addTag(p.subject, "secondary");
        addTag(p.neck, "neck");

        const linkWrap = document.createElement("div");
        linkWrap.className = "card-link";
        if (p.url && p.url !== "#") {
          const a = document.createElement("a");
          a.href = p.url;
          a.target = "_blank";
          a.rel = "noreferrer noopener";
          a.textContent = "ページを開く";
          linkWrap.appendChild(a);
        } else {
          linkWrap.textContent = "リンク未設定";
        }

        footer.appendChild(tags);
        footer.appendChild(linkWrap);

        body.appendChild(footer);
        card.appendChild(body);
        resultsEl.appendChild(card);
      });
    }

    function render() {
      const filtered = applyFilters();
      countEl.textContent =
        "該当文献：" +
        filtered.length +
        "件 / 全" +
        papers.length +
        "件";
      renderActiveFilters();
      renderResults(filtered);
    }

    function setupFilters() {
      const map = {
        disease: document.getElementById("filter-disease"),
        docType: document.getElementById("filter-docType"),
        content: document.getElementById("filter-content"),
        content2: document.getElementById("filter-content2"),
        subject: document.getElementById("filter-subject"),
        neck: document.getElementById("filter-neck")
      };

      Object.keys(map).forEach((key) => {
        map[key].addEventListener("change", (e) => {
          state[key] = e.target.value;

          if (key === "disease") {
            updateFilterOptionVisibility();
            updateFieldVisibility();
          }

          if (key === "content") {
            updateFieldVisibility(); // 有効性 → 有効性詳細を出す
          }

          render();
        });
      });

      document
        .getElementById("clear-filters")
        .addEventListener("click", () => {
          Object.keys(state).forEach((k) => (state[k] = ""));
          Object.values(map).forEach((sel) => (sel.value = ""));
          updateFilterOptionVisibility();
          updateFieldVisibility();
          render();
        });

      // 初期状態
      updateFilterOptionVisibility();
      updateFieldVisibility();
    }

    async function init() {
      try {
        const res = await fetch(DATA_URL);
        if (!res.ok) {
          throw new Error("fetch error: " + res.status);
        }
        papers = await res.json();
        setupFilters();
        render();
      } catch (e) {
        console.error(e);
        countEl.textContent = "データ読み込みエラー";
        emptyEl.style.display = "block";
        emptyEl.textContent =
          "データ読み込みに失敗しました。papers.json のURLを確認してください。";
      }
    }

    init();
  </script>
</body>
</html>
